<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div id="container">
        <input type="display" class="display" readonly>
        <div id="grid">
            <button class="op">+</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="op">-</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="op">x</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="op">/</button>
            <button>0</button>
            <button>.</button>
            <button class="op">=</button>
            <button class="op clear">C</button>
            
            
        </div>
        
    </div>
    
</body>
</html>
